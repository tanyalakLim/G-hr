<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="รูปประกอบประกาศการสอบแข่งขัน">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021235"/>
      <stop offset="0.45" stop-color="#062058"/>
      <stop offset="1" stop-color="#153fb5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.13"/>
    </pattern>
  </defs>

  <!-- พื้นหลังไล่สีน้ำเงิน (ชุดเดียวกับแบนเนอร์หลัก) -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- วงกลมตกแต่ง -->
  <circle cx="710" cy="80" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="750" cy="210" r="70" fill="#5b8cff" opacity="0.18"/>
  <circle cx="70" cy="370" r="100" fill="#5b8cff" opacity="0.15"/>
  <circle cx="620" cy="340" r="9" fill="#7ea4ff" opacity="0.5"/>
  <circle cx="180" cy="80" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- สัญลักษณ์การสอบ: กระดาษคำตอบ + ดินสอ -->
  <g>
    <rect x="330" y="96" width="180" height="230" rx="16" fill="#ffffff" opacity="0.92"/>
    <rect x="358" y="136" width="124" height="12" rx="6" fill="#062058" opacity="0.30"/>
    <rect x="358" y="168" width="96" height="12" rx="6" fill="#062058" opacity="0.22"/>
    <rect x="358" y="200" width="110" height="12" rx="6" fill="#062058" opacity="0.22"/>
    <rect x="358" y="232" width="72" height="12" rx="6" fill="#062058" opacity="0.16"/>
  </g>
  <g transform="rotate(45 540 300)">
    <rect x="460" y="288" width="110" height="24" rx="4" fill="#ffffff" opacity="0.9"/>
    <polygon points="570,284 570,316 596,300" fill="#ffffff" opacity="0.9"/>
    <polygon points="590,293 590,307 601,300" fill="#062058"/>
  </g>

  <!-- คลื่นด้านล่าง -->
  <path d="M0 330 C 140 290 260 390 420 362 C 560 338 680 280 800 320 L800 450 L0 450 Z" fill="url(#wave)"/>
  <path d="M0 392 C 180 350 360 430 540 404 C 660 388 740 360 800 380 L800 450 L0 450 Z" fill="#ffffff" opacity="0.10"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="รูปประกอบประกาศการสอบแข่งขัน — กำหนดการสอบ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021235"/>
      <stop offset="0.45" stop-color="#062a52"/>
      <stop offset="1" stop-color="#0f5c96"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.13"/>
    </pattern>
  </defs>

  <!-- พื้นหลังไล่สีน้ำเงิน (ชุดเดียวกับแบนเนอร์หลัก) -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- วงกลมตกแต่ง -->
  <circle cx="710" cy="70" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="755" cy="200" r="70" fill="#5b8cff" opacity="0.18"/>
  <circle cx="65" cy="370" r="100" fill="#5b8cff" opacity="0.15"/>
  <circle cx="640" cy="350" r="9" fill="#7ea4ff" opacity="0.5"/>
  <circle cx="150" cy="90" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- สัญลักษณ์กำหนดการสอบ: ปฏิทิน + นาฬิกา -->
  <g>
    <rect x="360" y="92" width="12" height="28" rx="6" fill="#062058" opacity="0.45"/>
    <rect x="428" y="92" width="12" height="28" rx="6" fill="#062058" opacity="0.45"/>
    <rect x="310" y="110" width="200" height="180" rx="16" fill="#ffffff" opacity="0.92"/>
    <path d="M310 126 a16 16 0 0 1 16 -16 h168 a16 16 0 0 1 16 16 v32 h-200 Z" fill="#062058" opacity="0.30"/>
    <circle cx="348" cy="190" r="9" fill="#062058" opacity="0.25"/>
    <circle cx="388" cy="190" r="9" fill="#062058" opacity="0.25"/>
    <circle cx="428" cy="190" r="9" fill="#062058" opacity="0.25"/>
    <circle cx="468" cy="190" r="9" fill="#062058" opacity="0.25"/>
    <circle cx="348" cy="228" r="9" fill="#062058" opacity="0.25"/>
    <circle cx="388" cy="228" r="9" fill="#062058" opacity="0.25"/>
    <circle cx="428" cy="228" r="12" fill="#062058" opacity="0.80"/>
    <circle cx="468" cy="228" r="9" fill="#062058" opacity="0.25"/>
    <circle cx="348" cy="262" r="9" fill="#062058" opacity="0.25"/>
    <circle cx="388" cy="262" r="9" fill="#062058" opacity="0.25"/>
  </g>
  <g>
    <circle cx="540" cy="300" r="56" fill="#ffffff" opacity="0.95"/>
    <path d="M540 300 L540 264" stroke="#062058" stroke-width="8" stroke-linecap="round"/>
    <path d="M540 300 L568 314" stroke="#062058" stroke-width="8" stroke-linecap="round"/>
    <circle cx="540" cy="300" r="7" fill="#062058"/>
  </g>

  <!-- คลื่นด้านล่าง -->
  <path d="M0 330 C 140 290 260 390 420 362 C 560 338 680 280 800 320 L800 450 L0 450 Z" fill="url(#wave)"/>
  <path d="M0 392 C 180 350 360 430 540 404 C 660 388 740 360 800 380 L800 450 L0 450 Z" fill="#ffffff" opacity="0.10"/>
</svg>
